name: dominoes
description: 'Domino Counter: a double-15 domino score calculator. Licensed under AGPL-3.0.'

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.0
  package_info_plus: ^9.0.0
  animations: ^2.1.1
  gap: ^3.0.1
  intl: ^0.20.2
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.1
  camera: ^0.11.1
  flutter_litert: 1.4.0
  permission_handler: ^11.3.1
  image: 4.13.1
  crypto: ^3.0.7
  path_provider: ^2.1.5
  sensors_plus: ^6.1.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  camera_platform_interface: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  # flutter_litert 1.4.0 bundles the iOS inference library through CocoaPods.
  # Its Swift package contains a stub and cannot load the model interpreters.
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/images/pips/
    - assets/images/launch_icon.png
    - assets/images/nav/
    - assets/images/icons/
    - assets/models/
    - assets/models/licenses/
    - assets/sfx/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: assets/branding/android_icon_grid.png
  adaptive_icon_foreground: assets/images/launch_icon.png
  adaptive_icon_foreground_inset: 19
  remove_alpha_ios: true
