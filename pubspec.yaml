name: dominoes
description: 'A new Flutter project.'

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.0.0
  package_info_plus: ^9.0.0
  animations: ^2.1.1
  gap: ^3.0.1
  intl: ^0.20.2
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.1
  camera: ^0.11.1
  flutter_litert: ^1.0.0
  permission_handler: ^11.3.1
  image: ^4.5.3
  path_provider: ^2.1.5
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/pips/
    - assets/images/nav/
    - assets/models/
